<div class="page-wrapper d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 80px)">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-8 col-lg-6">
        <div class="form-card fade-in">

          <div class="text-center mb-4">
            <div style="width:64px; height:64px; background: linear-gradient(135deg, #10b981, #06b6d4); border-radius:16px; margin: 0 auto; display:flex; align-items:center; justify-content:center">
              <i class="bi bi-person-plus-fill text-white fs-3"></i>
            </div>
            <h2 class="fw-bold mt-3 mb-1" style="color: var(--text-primary)">{{ 'register.title' | translate }}</h2>
            <p style="color: var(--text-secondary)">Crea tu cuenta gratuita</p>
          </div>

          @if (errorMsg()) {
            <div class="alert border-0 rounded-3 mb-4" style="background: rgba(239,68,68,.1); color: var(--danger)">
              <i class="bi bi-exclamation-circle me-2"></i>{{ errorMsg() }}
            </div>
          }

          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label-custom">{{ 'register.name' | translate }} *</label>
              <input type="text" class="form-control form-control-custom" [(ngModel)]="form.nombre"
                [placeholder]="'register.name' | translate">
            </div>
            <div class="col-sm-6">
              <label class="form-label-custom">{{ 'register.apellidos' | translate }} *</label>
              <input type="text" class="form-control form-control-custom" [(ngModel)]="form.apellidos"
                [placeholder]="'register.apellidos' | translate">
            </div>
            <div class="col-12">
              <label class="form-label-custom">{{ 'register.email' | translate }} *</label>
              <input type="email" class="form-control form-control-custom" [(ngModel)]="form.email"
                [placeholder]="'register.email' | translate">
            </div>
            <div class="col-sm-6">
              <label class="form-label-custom">{{ 'register.password' | translate }} *</label>
              <div class="position-relative">
                <input [type]="showPwd() ? 'text' : 'password'"
                  class="form-control form-control-custom" [(ngModel)]="form.password"
                  [placeholder]="'register.password' | translate">
                <button class="btn position-absolute end-0 top-50 translate-middle-y pe-3 bg-transparent border-0"
                  (click)="showPwd.set(!showPwd())" type="button" style="color: var(--text-muted)">
                  <i class="bi" [class.bi-eye]="!showPwd()" [class.bi-eye-slash]="showPwd()"></i>
                </button>
              </div>
            </div>
            <div class="col-sm-6">
              <label class="form-label-custom">{{ 'register.confirmPassword' | translate }} *</label>
              <input [type]="showPwd() ? 'text' : 'password'"
                class="form-control form-control-custom" [(ngModel)]="form.confirmPassword"
                [placeholder]="'register.confirmPassword' | translate">
            </div>
            <div class="col-12">
              <label class="form-label-custom">{{ 'register.phone' | translate }}</label>
              <input type="tel" class="form-control form-control-custom" [(ngModel)]="form.telefono"
                [placeholder]="'register.phone' | translate">
            </div>
          </div>

          <!-- Barra de fuerza contraseña -->
          @if (form.password) {
            <div class="mt-3">
              <div class="d-flex justify-content-between mb-1">
                <small style="color: var(--text-muted)">Seguridad de la contraseña</small>
                <small [style.color]="pwdStrengthColor()">{{ pwdStrengthLabel() }}</small>
              </div>
              <div style="height:4px; background: var(--border-color); border-radius:4px; overflow:hidden">
                <div [style.width.%]="pwdStrength() * 33.3" [style.background]="pwdStrengthColor()"
                  style="height:100%; border-radius:4px; transition: width .3s, background .3s"></div>
              </div>
            </div>
          }

          <button class="btn-primary-custom w-100 mt-4 mb-3" (click)="submit()" [disabled]="loading()">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            <i class="bi bi-person-check me-2"></i>{{ 'register.submit' | translate }}
          </button>

          <div class="text-center">
            <span style="color: var(--text-secondary); font-size:.9rem">{{ 'register.hasAccount' | translate }} </span>
            <a routerLink="/login" style="color: var(--primary); font-weight:700; text-decoration:none; font-size:.9rem">
              {{ 'register.login' | translate }}
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
