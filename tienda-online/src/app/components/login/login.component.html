<div class="page-wrapper d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 80px)">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-5">
        <div class="form-card fade-in">

          <!-- Logo -->
          <div class="text-center mb-4">
            <div style="width:64px; height:64px; background: linear-gradient(135deg, var(--primary), #8b5cf6); border-radius:16px; margin: 0 auto; display:flex; align-items:center; justify-content:center">
              <i class="bi bi-lightning-charge-fill text-white fs-3"></i>
            </div>
            <h2 class="fw-bold mt-3 mb-1" style="color: var(--text-primary)">{{ 'login.title' | translate }}</h2>
            <p style="color: var(--text-secondary)">Bienvenido de nuevo</p>
          </div>

          <!-- Error -->
          @if (error()) {
            <div class="alert border-0 rounded-3 mb-4" style="background: rgba(239,68,68,.1); color: var(--danger)">
              <i class="bi bi-exclamation-circle me-2"></i>{{ 'login.error' | translate }}
            </div>
          }

          <!-- Form -->
          <div class="mb-3">
            <label class="form-label-custom">{{ 'login.email' | translate }}</label>
            <input type="email" class="form-control form-control-custom"
              [(ngModel)]="email"
              [placeholder]="'login.email' | translate"
              (keyup.enter)="submit()">
          </div>
          <div class="mb-4">
            <div class="d-flex justify-content-between">
              <label class="form-label-custom">{{ 'login.password' | translate }}</label>
              <a href="#" style="font-size:.8rem; color: var(--primary); text-decoration:none">
                {{ 'login.forgotPassword' | translate }}
              </a>
            </div>
            <div class="position-relative">
              <input [type]="showPwd() ? 'text' : 'password'"
                class="form-control form-control-custom"
                [(ngModel)]="password"
                [placeholder]="'login.password' | translate"
                (keyup.enter)="submit()">
              <button class="btn position-absolute end-0 top-50 translate-middle-y pe-3 bg-transparent border-0"
                (click)="showPwd.set(!showPwd())" type="button"
                style="color: var(--text-muted)">
                <i class="bi" [class.bi-eye]="!showPwd()" [class.bi-eye-slash]="showPwd()"></i>
              </button>
            </div>
          </div>

          <button class="btn-primary-custom w-100 mb-3" (click)="submit()" [disabled]="loading()">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            <i class="bi bi-box-arrow-in-right me-2"></i>{{ 'login.submit' | translate }}
          </button>

          <div class="text-center">
            <span style="color: var(--text-secondary); font-size:.9rem">{{ 'login.noAccount' | translate }} </span>
            <a routerLink="/registro" style="color: var(--primary); font-weight:700; text-decoration:none; font-size:.9rem">
              {{ 'login.register' | translate }}
            </a>
          </div>

          <!-- Credenciales demo -->
          <div class="mt-4 p-3 rounded-3" style="background: var(--primary-light)">
            <p class="mb-1" style="color: var(--primary); font-size:.8rem; font-weight:700">
              <i class="bi bi-info-circle me-1"></i>Credenciales de demo:
            </p>
            <p class="mb-0" style="color: var(--primary); font-size:.75rem">
              Email: admin&#64;tfg.com — Contraseña: 1234
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
