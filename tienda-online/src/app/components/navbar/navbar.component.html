<nav class="navbar navbar-expand-lg navbar-custom sticky-top">
  <div class="container">
    <a class="navbar-brand" routerLink="/">
      <i class="bi bi-lightning-charge-fill me-1"></i>TecnoMarket
    </a>

    <button class="hamburger-btn" type="button"
      (click)="navOpen.set(!navOpen())"
      [class.open]="navOpen()"
      [attr.aria-expanded]="navOpen()">
      <span class="ham-line"></span>
      <span class="ham-line"></span>
      <span class="ham-line"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="navOpen()">
      <!-- Buscador centrado -->
      <div class="mx-auto d-flex align-items-center gap-2 my-2 my-lg-0">
        <div class="position-relative">
          <input
            type="text"
            class="search-input form-control"
            [placeholder]="'nav.search' | translate"
            [(ngModel)]="searchQuery"
            (keyup.enter)="search()"
            (input)="onSearchInput()"
          />
          <button class="btn position-absolute end-0 top-50 translate-middle-y pe-3 bg-transparent border-0"
            (click)="search()" style="color: var(--text-muted)">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </div>

      <!-- Links de navegación -->
      <ul class="navbar-nav align-items-lg-center gap-1 me-2">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
            <i class="bi bi-house me-1"></i>{{ 'nav.home' | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/productos" routerLinkActive="active">
            <i class="bi bi-grid me-1"></i>{{ 'nav.products' | translate }}
          </a>
        </li>
        @if (auth.isLoggedIn()) {
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button"
              data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i>{{ auth.usuario()?.nombre }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end" style="background: var(--bg-card); border-color: var(--border-color);">
              <li>
                <a class="dropdown-item" style="color: var(--text-primary)" routerLink="/mis-pedidos">
                  <i class="bi bi-bag me-2"></i>Mis pedidos
                </a>
              </li>
              <li><hr class="dropdown-divider" style="border-color: var(--border-color)"></li>
              <li>
                <button class="dropdown-item" style="color: var(--danger)" (click)="auth.logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>{{ 'nav.logout' | translate }}
                </button>
              </li>
            </ul>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">
              <i class="bi bi-person me-1"></i>{{ 'nav.login' | translate }}
            </a>
          </li>
        }
      </ul>

      <!-- Controles: tema, idioma, carrito -->
      <div class="d-flex align-items-center gap-2">
        <!-- Tema -->
        <button class="btn-icon" (click)="theme.toggleTheme()"
          [title]="theme.isDark() ? ('nav.light' | translate) : ('nav.dark' | translate)">
          <i class="bi" [class.bi-sun-fill]="theme.isDark()" [class.bi-moon-fill]="!theme.isDark()"></i>
        </button>

        <!-- Idioma -->
        <button class="btn-icon" (click)="ts.toggleLang()"
          [title]="ts.lang() === 'es' ? 'Switch to English' : 'Cambiar a Español'">
          <span style="font-size:0.75rem; font-weight:700">{{ ts.lang() === 'es' ? 'EN' : 'ES' }}</span>
        </button>

        <!-- Carrito con animación pop -->
        <a routerLink="/carrito" class="btn-icon cart-badge" [title]="'nav.cart' | translate" ripple>
          <i class="bi bi-cart3"></i>
          @if (carrito.cantidadTotal() > 0) {
            <span class="badge-count" [class.pop]="badgePop()">{{ carrito.cantidadTotal() }}</span>
          }
        </a>
      </div>
    </div>
  </div>
</nav>
